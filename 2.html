<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }
    #viewer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background: transparent;
      transform: translateZ(0);
    }
  </style>
</head>
<body>
  <iframe
    id="viewer"
    allow="clipboard-read; clipboard-write; fullscreen; geolocation; microphone; camera"
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads allow-top-navigation-by-user-activation"
  ></iframe>

  <script>
    (function () {
      const DB_URL = "https://webprojects-7b9b2-default-rtdb.firebaseio.com";

      const rawSearch = window.location.search.replace(/^\?/, "");
      const params = new URLSearchParams(window.location.search);
      let key = "web2";

      if (params.get("p")) {
        key = params.get("p");
      } else if (rawSearch && !rawSearch.includes("=")) {
        key = decodeURIComponent(rawSearch.split("&")[0]);
      }

      key = key.replace(/[^a-zA-Z0-9_-]/g, "") || "web2";

      fetch(`${DB_URL}/${key}.json`, { cache: "no-store" })
        .then((res) => {
          if (!res.ok) throw new Error("Fetch failed");
          return res.json();
        })
        .then((data) => {
          const html = typeof data === "string"
            ? data
            : data && (data.webcode || data.code || data.html);

          if (!html || typeof html !== "string") return;

          const titleMatch = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
          if (titleMatch && titleMatch[1]) {
            document.title = titleMatch[1].trim();
          }

          const iconMatch = html.match(/<link[^>]*rel=["'](?:shortcut )?icon["'][^>]*href=["']([^"']+)["'][^>]*>/i);
          if (iconMatch && iconMatch[1]) {
            const link = document.createElement("link");
            link.rel = "icon";
            link.href = iconMatch[1];
            document.head.appendChild(link);
          }

          document.getElementById("viewer").srcdoc = html;
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
